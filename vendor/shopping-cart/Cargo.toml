[package]
name = "equal-experts-shopping-cart"
version = "0.1.0"
edition = "2024"
publish = false
description = "A small shopping-cart library for the Equal Experts assignment"

[features]
default = ["native-http"]
native-http = ["dep:ureq"]

[dependencies]
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"], optional = true }

[dev-dependencies]
mockito = "=1.7.2"

[[test]]
name = "http_price_client"
required-features = ["native-http"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.dev]
debug = 1

[profile.test]
debug = 1
