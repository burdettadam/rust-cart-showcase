name: WebAssembly quality and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Rust components and WASM target
        run: rustup show active-toolchain
      - name: Verify pinned library source
        run: python3 scripts/verify_vendor.py
      - name: Format and lint all production Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native and documentation tests
        run: |
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --doc
          cargo test --locked -p equal-experts-shopping-cart --no-default-features --all-targets
      - name: Browser transport and session tests
        run: node --test tests/*.test.mjs
      - name: Release artifact verification tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Cache pinned coverage and WASM binding tools
        id: rust-tools-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/bin/wasm-bindgen
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('rust-toolchain.toml') }}-llvm-cov-0.6.21-wasm-bindgen-0.2.130
      - name: Install pinned coverage and WASM binding tools
        if: steps.rust-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-llvm-cov --locked --version 0.6.21
          cargo install wasm-bindgen-cli --locked --version 0.2.130
      - name: Verify pinned coverage and WASM binding tools
        run: |
          test "$(cargo llvm-cov --version)" = "cargo-llvm-cov 0.6.21"
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
      - name: Require at least 91 percent production Rust line coverage
        run: cargo llvm-cov --locked --workspace --all-targets --ignore-filename-regex '/tests/' --fail-under-lines 91
      - name: Build and execute the actual WebAssembly artifact
        run: |
          python3 scripts/build.py
          node scripts/verify-wasm.mjs
          python3 scripts/verify_dist.py --release
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload only the static showcase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
